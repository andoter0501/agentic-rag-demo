[project]
name = "agentic-rag-demo"
version = "0.2.0"
description = "Agentic RAG implementation with hybrid retrieval, reranking, and agent loop"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
embedding = [
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
]
vector = [
    "faiss-cpu>=1.7.0",
]
parser = [
    "pymupdf>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.0.0",
]
all = [
    "agentic-rag-demo[dev,embedding,vector,parser]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true