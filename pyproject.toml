[project]
name = "agentic-rag-demo"
version = "0.3.0"
description = "功能完整的 Agentic RAG 实现，支持混合检索、重排序、Agent Loop"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "andoter0501", email = "andoter0501@github.com"}
]
keywords = ["rag", "retrieval", "agent", "llm", "ragas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 核心可选依赖
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
# 向量模型依赖
embedding = [
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
]
# 向量数据库
vector = [
    "faiss-cpu>=1.7.0",
]
# 文档解析 (基础)
parser-basic = [
    "pymupdf>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.0.0",
    "chardet>=5.0.0",
]
# LlamaIndex 解析器
parser-llamaindex = [
    "llama-index>=0.10.0",
    "llama-index-core>=0.10.0",
]
# LangChain 解析器
parser-langchain = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-text-splitters>=0.0.1",
]
# MinerU 解析器
parser-mineru = [
    "mineru>=0.1.0",
]
# 完整解析器
parser = [
    "agentic-rag-demo[parser-basic,parser-llamaindex,parser-langchain,parser-mineru]",
]
# LLM 提供商
llm-anthropic = [
    "anthropic>=0.20.0",
]
llm-groq = [
    "groq>=0.5.0",
]
llm-together = [
    "together>=0.2.0",
]
# 完整 LLM 支持
llm = [
    "agentic-rag-demo[llm-anthropic,llm-groq,llm-together]",
]
# 完整依赖
all = [
    "agentic-rag-demo[dev,embedding,vector,parser,llm]",
]
# 生产环境
prod = [
    "gunicorn>=21.0.0",
    "uvicorn>=0.23.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
agentic-rag = "agentic_rag_demo.cli:main"
agentic-rag-eval = "agentic_rag_demo.cli:evaluate"

[project.urls]
Homepage = "https://github.com/andoter0501/agentic-rag-demo"
Documentation = "https://github.com/andoter0501/agentic-rag-demo#readme"
Repository = "https://github.com/andoter0501/agentic-rag-demo"
Issues = "https://github.com/andoter0501/agentic-rag-demo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_rag_demo"]

[tool.hatch.build.targets.sdist]
include = [
    "/agentic_rag_demo",
    "/data",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["agentic_rag_demo"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llama_index.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mineru.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "groq.*"
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"